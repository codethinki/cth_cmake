name: Windows Pipeline

on:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Windows (${{ inputs.compiler }})
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # Forces Git Bash for consistency with Linux scripts

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-windows
        with:
          compiler: ${{ inputs.compiler }}

      - uses: ./.github/actions/setup-vcpkg-cache

      - name: Build basic
        uses: ./.github/actions/build-example
        with:
          example: basic
          preset: ci_windows_${{ inputs.compiler }}

      - name: Test basic
        uses: ./.github/actions/test-example
        with:
          example: basic
          preset: ci_windows_${{ inputs.compiler }}

      - name: Build modules
        uses: ./.github/actions/build-example
        with:
          example: modules
          preset: ci_windows_${{ inputs.compiler }}

      - name: Test modules
        uses: ./.github/actions/test-example
        with:
          example: modules
          preset: ci_windows_${{ inputs.compiler }}
